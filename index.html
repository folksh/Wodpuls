<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0d10">
<title>WOD Puls</title>
<style>
  :root{
    --bg:#0b0d10; --panel:#14171c; --line:#252a31; --text:#f2f4f7; --mute:#8a93a0;
    --z0:#4b5563; --z1:#7c8aa0; --z2:#3b82f6; --z3:#22c55e; --z4:#f59e0b; --z5:#ef4444;
    --zone:var(--z0);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,sans-serif}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overscroll-behavior:none;user-select:none;-webkit-user-select:none}
  .app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:12px 16px 20px;position:relative}
  .glow{position:fixed;inset:0;pointer-events:none;transition:background .6s;
    background:radial-gradient(120% 70% at 50% 100%, color-mix(in srgb,var(--zone) 30%,transparent), transparent 70%)}
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  .top{display:flex;justify-content:space-between;align-items:center;gap:8px;position:relative;z-index:1}
  .chip{display:flex;align-items:center;gap:8px;padding:9px 14px;border-radius:999px;background:var(--panel);
    border:1px solid var(--line);font-size:14px;font-weight:600}
  .dot{width:9px;height:9px;border-radius:50%;background:var(--mute)}
  .dot.on{background:var(--z3);box-shadow:0 0 8px var(--z3)}
  .dot.warn{background:var(--z4)}
  .icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line)}
  .screen{display:none;flex:1;flex-direction:column;position:relative;z-index:1}
  .screen.active{display:flex}

  /* setup */
  h1{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:26px 0 18px}
  .seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px}
  .seg button{padding:13px;border-radius:10px;font-weight:700;font-size:16px;color:var(--mute)}
  .seg button.on{background:var(--text);color:var(--bg)}
  .field{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;
    display:flex;align-items:center;justify-content:space-between}
  .field label{font-size:15px;color:var(--mute);font-weight:600}
  .step{display:flex;align-items:center;gap:6px}
  .step button{width:44px;height:44px;border-radius:12px;background:#1d2128;font-size:22px;font-weight:700}
  .step .val{min-width:84px;text-align:center;font-size:26px;font-weight:800}
  .hint{color:var(--mute);font-size:14px;margin-top:14px;line-height:1.45}
  .spacer{flex:1}
  .primary{width:100%;padding:20px;border-radius:18px;background:var(--text);color:var(--bg);font-size:20px;font-weight:800;margin-top:24px}
  .ghost{padding:14px 18px;border-radius:14px;background:var(--panel);border:1px solid var(--line);font-weight:700}

  /* run */
  .phase{text-align:center;margin-top:18px;font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
  .clock{text-align:center;font-size:min(30vw,170px);font-weight:800;line-height:1;letter-spacing:-.04em;margin-top:4px}
  .clock.small{font-size:min(22vw,120px)}
  .sub{text-align:center;color:var(--mute);font-size:18px;font-weight:600;margin-top:6px;min-height:24px}
  .hr{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:16px 18px;
    border-top:4px solid var(--zone);transition:border-color .4s}
  .hrrow{display:flex;align-items:baseline;justify-content:space-between}
  .bpm{font-size:72px;font-weight:800;line-height:1;letter-spacing:-.03em}
  .bpm small{font-size:18px;color:var(--mute);font-weight:700;margin-left:6px;letter-spacing:0}
  .zname{text-align:right}
  .zname b{display:block;font-size:34px;font-weight:800;color:var(--zone)}
  .zname span{font-size:14px;color:var(--mute);font-weight:600}
  .bar{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:14px;height:12px}
  .bar i{border-radius:4px;opacity:.35}
  .bar i.on{opacity:1}
  .marker{position:absolute;top:-5px;width:4px;height:22px;border-radius:2px;background:var(--text);transition:left .5s;left:0}
  .rounds{display:flex;gap:10px;margin-top:16px}
  .rounds .plus{flex:1;padding:22px;border-radius:18px;background:var(--text);color:var(--bg);font-size:22px;font-weight:800}
  .rounds .minus{width:76px;border-radius:18px;background:var(--panel);border:1px solid var(--line);font-size:24px;font-weight:800}
  .ctrl{display:flex;gap:10px;margin-top:14px}
  .ctrl button{flex:1}
  .stop{color:var(--z5)}

  /* summary */
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:6px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
  .stat span{display:block;color:var(--mute);font-size:13px;font-weight:600}
  .stat b{font-size:26px;font-weight:800}
  .zt{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .ztrow{display:grid;grid-template-columns:34px 1fr 56px;align-items:center;gap:10px;margin:7px 0;font-weight:700;font-size:15px}
  .ztrow .track{height:10px;background:#1d2128;border-radius:5px;overflow:hidden}
  .ztrow .fill{height:100%;border-radius:5px}
  .ztrow .t{text-align:right;color:var(--mute)}
  svg.chart{width:100%;height:140px;display:block;margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:16px}

  /* sheet */
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;z-index:10}
  .sheet.open{display:flex}
  .sheet .card{width:100%;max-width:560px;margin:0 auto;background:var(--bg);border-top:1px solid var(--line);
    border-radius:22px 22px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom))}
  .sheet h2{font-size:20px;font-weight:800}
  .zlist{margin-top:12px;font-size:14px;color:var(--mute);line-height:1.8}
  .zlist b{display:inline-block;width:30px}
  .msg{margin-top:12px;padding:12px 14px;border-radius:12px;background:#2a1d0c;color:#fbd38d;font-size:14px;line-height:1.45;display:none}
  .msg.show{display:block}
</style>
</head>
<body>
<div class="glow"></div>
<div class="app">
  <div class="top">
    <button class="chip" id="hrBtn"><span class="dot" id="hrDot"></span><span id="hrLabel">Anslut Whoop</span></button>
    <button class="icon" id="setBtn" aria-label="Inställningar">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>
    </button>
  </div>
  <div class="msg" id="msg"></div>

  <!-- SETUP -->
  <section class="screen active" id="sSetup">
    <h1>Välj WOD</h1>
    <div class="seg" id="modeSeg">
      <button data-m="amrap" class="on">AMRAP</button>
      <button data-m="emom">EMOM</button>
    </div>
    <div id="amrapFields">
      <div class="field"><label>Tid</label>
        <div class="step"><button data-k="amrapMin" data-d="-1">−</button><div class="val num" id="v_amrapMin"></div><button data-k="amrapMin" data-d="1">+</button></div>
      </div>
    </div>
    <div id="emomFields" style="display:none">
      <div class="field"><label>Intervall</label>
        <div class="step"><button data-k="emomInt" data-d="-15">−</button><div class="val num" id="v_emomInt"></div><button data-k="emomInt" data-d="15">+</button></div>
      </div>
      <div class="field"><label>Rundor</label>
        <div class="step"><button data-k="emomRounds" data-d="-1">−</button><div class="val num" id="v_emomRounds"></div><button data-k="emomRounds" data-d="1">+</button></div>
      </div>
      <p class="hint" id="emomHint"></p>
    </div>
    <div class="spacer"></div>
    <button class="primary" id="startBtn">Starta</button>
  </section>

  <!-- RUN -->
  <section class="screen" id="sRun">
    <div class="phase" id="phase">Gör dig redo</div>
    <div class="clock num" id="clock">0:10</div>
    <div class="sub num" id="sub"></div>

    <div class="hr">
      <div class="hrrow">
        <div class="bpm num"><span id="bpm">--</span><small>BPM</small></div>
        <div class="zname"><b id="zLabel">–</b><span id="zPct">&nbsp;</span></div>
      </div>
      <div class="bar" id="bar">
        <i style="background:var(--z1)"></i><i style="background:var(--z2)"></i><i style="background:var(--z3)"></i><i style="background:var(--z4)"></i><i style="background:var(--z5)"></i>
        <div class="marker" id="marker"></div>
      </div>
    </div>

    <div class="rounds" id="roundsBox">
      <button class="minus" id="rMinus">−1</button>
      <button class="plus" id="rPlus">+1 runda</button>
    </div>
    <div class="spacer"></div>
    <div class="ctrl">
      <button class="ghost" id="pauseBtn">Paus</button>
      <button class="ghost stop" id="stopBtn">Avsluta</button>
    </div>
  </section>

  <!-- DONE -->
  <section class="screen" id="sDone">
    <h1 id="doneTitle">Klart</h1>
    <div class="stats">
      <div class="stat"><span id="s1l">Tid</span><b class="num" id="s1">–</b></div>
      <div class="stat"><span>Snitt puls</span><b class="num" id="s2">–</b></div>
      <div class="stat"><span>Max puls</span><b class="num" id="s3">–</b></div>
    </div>
    <div class="zt" id="zt"></div>
    <svg class="chart" id="chart" viewBox="0 0 300 140" preserveAspectRatio="none"></svg>
    <div class="spacer"></div>
    <button class="primary" id="againBtn">Ny WOD</button>
  </section>
</div>

<!-- SETTINGS -->
<div class="sheet" id="sheet">
  <div class="card">
    <h2>Inställningar</h2>
    <div class="field"><label>Maxpuls</label>
      <div class="step"><button data-k="maxHr" data-d="-1">−</button><div class="val num" id="v_maxHr"></div><button data-k="maxHr" data-d="1">+</button></div>
    </div>
    <div class="field"><label>Nedräkning</label>
      <div class="step"><button data-k="prep" data-d="-5">−</button><div class="val num" id="v_prep"></div><button data-k="prep" data-d="5">+</button></div>
    </div>
    <div class="zlist" id="zlist"></div>
    <button class="ghost" id="demoBtn" style="width:100%;margin-top:14px">Testläge: simulerad puls</button>
    <button class="primary" id="closeSheet" style="margin-top:12px">Klar</button>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const ZC = ['var(--z0)','var(--z1)','var(--z2)','var(--z3)','var(--z4)','var(--z5)'];
  const ZB = [0.5,0.6,0.7,0.8,0.9]; // lower bounds Z1..Z5 as % of max

  // ---------- settings ----------
  const LIM = { amrapMin:[1,60], emomInt:[15,600], emomRounds:[1,60], maxHr:[120,230], prep:[0,30] };
  let cfg = { mode:'amrap', amrapMin:12, emomInt:60, emomRounds:10, maxHr:190, prep:10 };
  try { Object.assign(cfg, JSON.parse(localStorage.getItem('wodpuls') || '{}')); } catch(e) {}
  const save = () => { try { localStorage.setItem('wodpuls', JSON.stringify(cfg)); } catch(e) {} };

  const fmt = s => { s = Math.max(0, Math.round(s)); const m = Math.floor(s/60), r = s%60; return m + ':' + String(r).padStart(2,'0'); };
  const fmtInt = s => s % 60 === 0 ? (s/60) + ' min' : fmt(s);

  function renderCfg(){
    $('v_amrapMin').textContent = cfg.amrapMin + ' min';
    $('v_emomInt').textContent = fmtInt(cfg.emomInt);
    $('v_emomRounds').textContent = cfg.emomRounds;
    $('v_maxHr').textContent = cfg.maxHr;
    $('v_prep').textContent = cfg.prep + ' s';
    $('emomHint').textContent = (cfg.emomInt === 60 ? 'EMOM' : 'E' + fmtInt(cfg.emomInt) + 'OM') + ' · totalt ' + fmt(cfg.emomInt * cfg.emomRounds);
    document.querySelectorAll('#modeSeg button').forEach(b => b.classList.toggle('on', b.dataset.m === cfg.mode));
    $('amrapFields').style.display = cfg.mode === 'amrap' ? '' : 'none';
    $('emomFields').style.display = cfg.mode === 'emom' ? '' : 'none';
    const names = ['Z1 Återhämtning','Z2 Lätt','Z3 Medel','Z4 Tröskel','Z5 Max'];
    $('zlist').innerHTML = names.map((n,i) => {
      const lo = Math.round(cfg.maxHr*ZB[i]), hi = i<4 ? Math.round(cfg.maxHr*ZB[i+1])-1 : cfg.maxHr;
      return `<div><b style="color:${ZC[i+1]}">●</b>${n}: ${lo}–${hi}</div>`;
    }).join('');
  }
  document.querySelectorAll('.step button').forEach(b => {
    b.addEventListener('click', () => {
      const k = b.dataset.k, d = +b.dataset.d, [lo,hi] = LIM[k];
      cfg[k] = Math.min(hi, Math.max(lo, cfg[k] + d)); save(); renderCfg();
    });
  });
  document.querySelectorAll('#modeSeg button').forEach(b => b.addEventListener('click', () => { cfg.mode = b.dataset.m; save(); renderCfg(); }));
  $('setBtn').onclick = () => $('sheet').classList.add('open');
  $('closeSheet').onclick = () => $('sheet').classList.remove('open');
  $('sheet').addEventListener('click', e => { if (e.target.id === 'sheet') $('sheet').classList.remove('open'); });

  function showMsg(t){ const m = $('msg'); m.textContent = t; m.classList.toggle('show', !!t); }

  // ---------- heart rate ----------
  let hr = null, hrTs = 0, device = null, demoTimer = null, wantConnected = false;
  const now = () => performance.now();
  const liveHr = () => (hr && now() - hrTs < 5000) ? hr : null;
  function zoneOf(b){ if (!b) return 0; const p = b / cfg.maxHr; let z = 0; ZB.forEach((lo,i) => { if (p >= lo) z = i+1; }); return z; }

  function setHrStatus(state, label){
    const d = $('hrDot'); d.className = 'dot' + (state === 'on' ? ' on' : state === 'warn' ? ' warn' : '');
    $('hrLabel').textContent = label;
  }
  function onHr(v){ hr = v; hrTs = now(); renderHr(); }

  async function gattConnect(){
    const server = await device.gatt.connect();
    const svc = await server.getPrimaryService('heart_rate');
    const ch = await svc.getCharacteristic('heart_rate_measurement');
    ch.addEventListener('characteristicvaluechanged', e => {
      const v = e.target.value, f = v.getUint8(0);
      onHr((f & 1) ? v.getUint16(1, true) : v.getUint8(1));
    });
    await ch.startNotifications();
    setHrStatus('on', device.name || 'Ansluten');
  }
  async function reconnect(){
    for (let i = 0; i < 20 && wantConnected; i++) {
      setHrStatus('warn', 'Återansluter…');
      try { await gattConnect(); return; } catch(e) { await new Promise(r => setTimeout(r, Math.min(1000 * (i+1), 5000))); }
    }
    if (wantConnected) setHrStatus('', 'Tappade puls – tryck för att ansluta');
  }
  async function connect(){
    showMsg('');
    if (!navigator.bluetooth) {
      showMsg('Den här webbläsaren saknar Bluetooth. På iPhone: öppna sidan i appen Bluefy. På Android/dator: använd Chrome.');
      return;
    }
    try {
      device = await navigator.bluetooth.requestDevice({ filters: [{ services: ['heart_rate'] }] });
      device.addEventListener('gattserverdisconnected', () => { if (wantConnected) reconnect(); });
      wantConnected = true; stopDemo();
      setHrStatus('warn', 'Ansluter…');
      await gattConnect();
    } catch(e) {
      if (e && e.name === 'NotFoundError') { setHrStatus('', 'Anslut Whoop'); return; }
      setHrStatus('', 'Anslut Whoop');
      showMsg('Kunde inte ansluta. Kolla att Heart Rate Broadcast är på i Whoop-appen (bandet blinkar blått) och att ingen annan app använder pulsen.');
    }
  }
  $('hrBtn').onclick = () => { if (device && device.gatt.connected) return; if (device && wantConnected) { reconnect(); return; } connect(); };

  function stopDemo(){ if (demoTimer) { clearInterval(demoTimer); demoTimer = null; $('demoBtn').textContent = 'Testläge: simulerad puls'; } }
  $('demoBtn').onclick = () => {
    if (demoTimer) { stopDemo(); setHrStatus('', 'Anslut Whoop'); hr = null; renderHr(); return; }
    let v = 110, target = 150;
    demoTimer = setInterval(() => {
      if (Math.random() < 0.05) target = 100 + Math.random() * 85;
      v += (target - v) * 0.08 + (Math.random() - 0.5) * 3; onHr(Math.round(v));
    }, 1000);
    setHrStatus('on', 'Testläge'); $('demoBtn').textContent = 'Stäng av testläge';
  };

  function renderHr(){
    const b = liveHr(), z = zoneOf(b);
    $('bpm').textContent = b ?? '--';
    document.documentElement.style.setProperty('--zone', ZC[z]);
    $('zLabel').textContent = b ? (z ? 'Z' + z : '<Z1') : '–';
    $('zPct').textContent = b ? Math.round(b / cfg.maxHr * 100) + '% av max' : ' ';
    document.querySelectorAll('#bar i').forEach((el,i) => el.classList.toggle('on', i+1 === z));
    // marker across 50%–100%
    const p = b ? Math.min(1, Math.max(0, (b / cfg.maxHr - 0.5) / 0.5)) : 0;
    $('marker').style.left = `calc(${p * 100}% - 2px)`;
    $('marker').style.opacity = b ? 1 : 0;
  }

  // ---------- audio ----------
  let ac = null;
  function initAudio(){ try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch(e) {} }
  function beep(freq = 880, dur = 0.12, vol = 0.5){
    if (!ac) return;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'square'; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, ac.currentTime); g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + dur);
    o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime + dur + 0.02);
  }
  const shortBeep = () => beep(880, 0.12);
  const longBeep = () => beep(1320, 0.55, 0.6);

  // ---------- wake lock ----------
  let wl = null;
  async function lockScreen(){ try { wl = await navigator.wakeLock?.request('screen'); } catch(e) {} }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && run && run.state !== 'done') lockScreen(); });

  // ---------- run ----------
  let run = null, raf = null;
  function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id)); }

  function start(){
    initAudio(); lockScreen();
    const total = cfg.mode === 'amrap' ? cfg.amrapMin * 60 : cfg.emomInt * cfg.emomRounds;
    run = { mode: cfg.mode, total, int: cfg.emomInt, rounds: cfg.emomRounds, t0: now() + cfg.prep * 1000,
            pausedAt: null, state: 'run', lastKey: '', lastBoundary: null, lastSec: -1,
            samples: [], zoneSec: [0,0,0,0,0,0], amrapRounds: 0 };
    $('roundsBox').style.display = run.mode === 'amrap' ? '' : 'none';
    $('pauseBtn').textContent = 'Paus';
    show('sRun'); tick();
  }
  const elapsed = () => ((run.pausedAt ?? now()) - run.t0) / 1000;

  function tick(){
    if (!run || run.state === 'done') return;
    const el = elapsed();
    // boundaries
    let boundaryIdx, next;
    if (el < 0) { boundaryIdx = -1; next = 0; }
    else if (run.mode === 'emom') { boundaryIdx = Math.floor(el / run.int); next = (boundaryIdx + 1) * run.int; }
    else { boundaryIdx = 0; next = run.total; }

    if (run.state === 'run') {
      if (run.lastBoundary !== null && boundaryIdx !== run.lastBoundary && el < run.total) longBeep();
      run.lastBoundary = boundaryIdx;
      const s = Math.ceil(next - el), key = next + ':' + s;
      if (s >= 1 && s <= 3 && key !== run.lastKey && el > -cfg.prep + 0.2) { shortBeep(); run.lastKey = key; }
      // 1 Hz sampling
      const sec = Math.floor(el);
      if (el >= 0 && sec !== run.lastSec) {
        run.lastSec = sec; const b = liveHr();
        run.samples.push(b); run.zoneSec[zoneOf(b)] += b ? 1 : 0;
      }
    }

    if (el >= run.total) { finish(); return; }

    // render
    const clock = $('clock');
    if (el < 0) {
      $('phase').textContent = 'Gör dig redo'; clock.textContent = fmt(Math.ceil(-el)); clock.classList.remove('small'); $('sub').textContent = run.mode === 'amrap' ? 'AMRAP ' + cfg.amrapMin + ' min' : (run.int === 60 ? 'EMOM' : 'E' + fmtInt(run.int) + 'OM') + ' × ' + run.rounds;
    } else if (run.mode === 'amrap') {
      $('phase').textContent = run.pausedAt ? 'Pausad' : 'AMRAP';
      clock.textContent = fmt(Math.ceil(run.total - el)); clock.classList.remove('small');
      $('sub').textContent = run.amrapRounds + (run.amrapRounds === 1 ? ' runda' : ' rundor') + ' · ' + fmt(el) + ' gått';
    } else {
      const r = Math.min(run.rounds, Math.floor(el / run.int) + 1);
      $('phase').textContent = run.pausedAt ? 'Pausad' : 'Runda ' + r + ' / ' + run.rounds;
      clock.textContent = fmt(Math.ceil(run.int - (el % run.int))); clock.classList.toggle('small', false);
      $('sub').textContent = fmt(run.total - el) + ' kvar totalt';
    }
    renderHr();
    raf = requestAnimationFrame(tick);
  }

  function togglePause(){
    if (!run) return;
    if (run.pausedAt) { run.t0 += now() - run.pausedAt; run.pausedAt = null; run.state = 'run'; $('pauseBtn').textContent = 'Paus'; }
    else { run.pausedAt = now(); run.state = 'paused'; $('pauseBtn').textContent = 'Fortsätt'; }
  }
  $('pauseBtn').onclick = togglePause;
  $('stopBtn').onclick = () => { if (!run) return; if (elapsed() <= 0) { cancelAnimationFrame(raf); run = null; show('sSetup'); return; } finish(true); };
  $('rPlus').onclick = () => { if (run && elapsed() >= 0) { run.amrapRounds++; beep(660, 0.06, 0.3); } };
  $('rMinus').onclick = () => { if (run && run.amrapRounds > 0) run.amrapRounds--; };
  $('startBtn').onclick = start;
  $('againBtn').onclick = () => { run = null; show('sSetup'); };

  function finish(early){
    cancelAnimationFrame(raf);
    const el = Math.min(run.total, Math.max(0, elapsed()));
    run.state = 'done'; if (!early) longBeep(), setTimeout(longBeep, 650);
    try { wl && wl.release(); } catch(e) {}
    const valid = run.samples.filter(Boolean);
    const avg = valid.length ? Math.round(valid.reduce((a,b) => a+b, 0) / valid.length) : null;
    const max = valid.length ? Math.max(...valid) : null;
    $('doneTitle').textContent = early ? 'Avbruten' : 'Klart 💪';
    if (run.mode === 'amrap') { $('s1l').textContent = 'Rundor'; $('s1').textContent = run.amrapRounds; }
    else { $('s1l').textContent = 'Tid'; $('s1').textContent = fmt(el); }
    $('s2').textContent = avg ?? '–'; $('s3').textContent = max ?? '–';
    const tot = run.zoneSec.slice(1).reduce((a,b) => a+b, 0) || 1;
    $('zt').innerHTML = [5,4,3,2,1].map(z => `<div class="ztrow"><b style="color:${ZC[z]}">Z${z}</b>
      <div class="track"><div class="fill" style="width:${run.zoneSec[z]/tot*100}%;background:${ZC[z]}"></div></div>
      <span class="t num">${fmt(run.zoneSec[z])}</span></div>`).join('') + (valid.length ? '' : '<p class="hint">Ingen pulsdata under passet.</p>');
    drawChart(run.samples);
    show('sDone');
  }

  function drawChart(s){
    const W = 300, H = 140, lo = Math.round(cfg.maxHr * 0.45), hi = cfg.maxHr;
    const y = v => H - (Math.min(hi, Math.max(lo, v)) - lo) / (hi - lo) * H;
    let out = '';
    ZB.forEach((p,i) => { const top = y(i < 4 ? cfg.maxHr * ZB[i+1] : hi), bot = y(cfg.maxHr * p);
      out += `<rect x="0" y="${top}" width="${W}" height="${bot-top}" fill="${ZC[i+1]}" opacity=".08"/>`; });
    if (s.length > 1) {
      let d = '', pen = false;
      s.forEach((v,i) => { const x = i / (s.length - 1) * W;
        if (v) { d += (pen ? 'L' : 'M') + x.toFixed(1) + ' ' + y(v).toFixed(1); pen = true; } else pen = false; });
      out += `<path d="${d}" fill="none" stroke="#f2f4f7" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>`;
    }
    $('chart').innerHTML = out;
  }

  renderCfg(); renderHr();
})();
</script>
</body>
